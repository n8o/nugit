# nugit configuration (keystone subset).
# Most of the architecture spec's config surface (retrieval budgets, embedding
# settings, merge rules) is deferred until the index/retrieval epics. The
# keystone only needs the bits below.

schema_version: 1

c4:
  dsl: .nugit/architecture/workspace.dsl
  # mode: enforce | warn  (enforce = undeclared dependencies fail the check)
  mode: enforce

significance:
  # Heuristic thresholds (§13.6 "start heuristic; escalate only if noisy").
  trivial_max_files: 2
  trivial_max_churn: 20

pr_render:
  # Exit non-zero when a finding reaches this severity (CI gate).
  fail_on: fail

plan:
  # scope: touched (default) | all — ADR-0040.
  # A Beads store is repo-wide: under agent fan-out every concurrent session
  # writes the same .beads/. `touched` renders only the plans THIS PR moved, so
  # a PR cannot present another agent's progress as its own; `all` renders the
  # whole board.
  scope: touched
  # mode: warn (default) | fail | off — gates the `plan-store` checks.
  # warn while a store is being cleaned up; fail once it is (an id collision
  # makes one step invisible). off for a repo that keeps a store and does not
  # want nugit's opinion about its shape.
  mode: warn

capture:
  # warn (default) | nudge | block | off — ADR-0023.
  # nudge: on a SIGNIFICANT commit with no trailer block, the commit-msg hook
  # prints a copy-pasteable stub seeded from the touched components. It never
  # blocks and never fails the commit. Chosen here because this repo's own
  # doctor reports most components with no scoped knowledge: the bottleneck is
  # capture reach, and the hook is the moment the author still holds the why.
  commit_msg: nudge
