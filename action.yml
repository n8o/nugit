name: "nugit PR view"
description: "Compute and post the nugit unified PR view — C4 architecture delta, knowledge delta, and cross-artifact consistency checks — as a sticky PR comment + check gate."
branding:
  icon: "git-pull-request"
  color: "purple"

inputs:
  base:
    description: "Base ref to diff from."
    default: "${{ github.event.pull_request.base.sha }}"
  head:
    description: "Head ref to diff to."
    default: "${{ github.sha }}"
  working-directory:
    description: "The nugit root (where .nugit/ lives), relative to the repo."
    default: "."
  fail-on:
    description: "Fail the job when findings reach this severity: fail | warn | none."
    default: "fail"
  comment:
    description: "Post/update a sticky PR comment (requires a token with pull-requests: write)."
    default: "true"
  github-token:
    description: "Token for the sticky PR comment."
    default: "${{ github.token }}"

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "stable"

    - name: Build nugit
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/nugit" "$ACTION_PATH/cmd/nugit"

    # Every input is passed through env (NEVER interpolated into the script body)
    # so an attacker-influenced value can't inject shell — GitHub's required pattern.
    - name: Render PR view and report
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_WORKDIR: ${{ inputs.working-directory }}
        INPUT_FAILON: ${{ inputs.fail-on }}
        INPUT_COMMENT: ${{ inputs.comment }}
      run: |
        set -o pipefail
        out="$RUNNER_TEMP/nugit.md"
        set +e
        "$RUNNER_TEMP/nugit" pr-render \
          -C "$INPUT_WORKDIR" \
          -base "$INPUT_BASE" \
          -head "$INPUT_HEAD" \
          -fail-on "$INPUT_FAILON" \
          -format markdown | tee "$out"
        code=${PIPESTATUS[0]}
        set -e

        # Always surface in the Actions run summary (no token needed).
        cat "$out" >> "$GITHUB_STEP_SUMMARY"

        # Sticky PR comment (find-by-marker, update or create).
        marker="<!-- nugit-pr-view -->"
        if [ "$INPUT_COMMENT" = "true" ] && [ -n "${PR_NUMBER:-}" ]; then
          body="$marker"$'\n'"$(cat "$out")"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty" 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null || true
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null || true
          fi
        fi

        exit "$code"
